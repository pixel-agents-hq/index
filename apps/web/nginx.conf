server {
    listen 80;
    # Also bind IPv6: `localhost` resolves to ::1 first inside the container,
    # so an IPv4-only listener makes any localhost healthcheck fail with
    # "connection refused" even though the site is served fine.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # index.html is what every client-side route ultimately resolves through
    # (the SPA's own router takes over from there) — never cache it, or a
    # deploy that ships a new asset hash would keep serving the old bundle
    # reference until the cache expires.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's build output under /assets/ is content-hashed — a given filename
    # never changes contents, so this is the one place a long cache is safe.
    # Matched by FILE NAME (every one has an extension), not by the /assets/
    # prefix: the app's own routes live under /assets/ too (/assets/submit,
    # /assets/design, /assets/<ASSET_ID> — ids never contain a dot), and a
    # prefix location here served them as missing files, so a reload or a
    # shared link 404'd while in-app navigation worked. A missing build file
    # still 404s rather than getting index.html under an immutable cache.
    location ~ ^/assets/.+\.[A-Za-z0-9]+$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # A real client-side route (e.g. /layouts/some-office) has no matching
    # file on disk — fall through to index.html and let React Router resolve
    # it, the same problem GitHub Pages' 404.html trick solves without a
    # server. nginx does not need that trick: it can just rewrite directly.
    location / {
        try_files $uri /index.html;
    }
}
