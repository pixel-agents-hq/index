name: CI

on:
  pull_request:
  # develop as well as main (#64). A pull request's checks are run against a
  # merge of its head with the base — the squashed commit that actually lands
  # on develop is a commit nothing has ever tested, and two individually-green
  # pull requests can land on top of each other into a broken tree. Since
  # `advance-main.yml` promotes develop's *tip* to production and gates itself
  # on that tip's checks, that tip has to have checks in the first place.
  push:
    branches: [main, develop]

jobs:
  validate:
    name: Validate layouts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      # The containers cannot read the submodule's git, so the pin ships as a
      # committed file (see tools/vendor-commit.mjs). This is what stops that
      # file from quietly describing an upstream the repo no longer pins — the
      # check is the reason the file is trustworthy enough to build images from.
      - name: The vendor commit stamp matches the submodule pin
        run: npm run vendor:commit:check

      # The published furniture manifest schema's category enum is generated
      # from the pinned vendor's real bundled manifests (tools/generate-
      # furniture-categories-schema.mjs), not hand-typed — this is what
      # stops it from silently drifting after a vendor bump.
      - name: The furniture category enum matches the pinned vendor manifests
        run: npm run furniture-categories:schema:check

      # The built-in character profiles services/api publishes are the pinned
      # vendor's default cast, composed by its own wardrobe renderer at
      # generation time (apps/web/build/generateBuiltinProfiles.ts) — this is
      # what stops them from silently drifting after a vendor bump.
      - name: The built-in character profiles match the pinned vendor's default cast
        run: npm run builtin-profiles:check

      # Builds @pixel-index/layout-core, then runs its CLI over seed/.
      - name: Validate the seed layouts against the pinned Pixel Agents
        run: npm run validate

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    # Every docs-only check lives in this one job: none of them need the
    # submodule or layout-core's dist, so it starts and finishes while the
    # heavier jobs are still installing, and a broken doc reads as "Markdown"
    # in the checks list instead of as a failing unit test. Deliberately not
    # folded into the `renderer` job either — that one installs Chromium, and
    # the whole point of these checks is that none of them need a browser.
    steps:
      - uses: actions/checkout@v4
        # No `submodules: recursive`: `git ls-files` does not descend into the
        # submodule, so vendor/pixel-agents' markdown is never checked and
        # cloning it here would be dead weight.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      # Style lint (heading structure, fenced-code languages, bare URLs, …).
      # See .markdownlint.json for the two house-style exceptions.
      - name: Lint markdown style
        run: npm run lint:md

      # Confirms every relative link between markdown files still resolves —
      # see tools/check-links.mjs for why http(s) links are not checked here.
      - name: Every relative markdown link resolves
        run: npm run check:links

      # GitHub renders the diagrams in our markdown, and a diagram with a syntax
      # error renders as a red error box in the docs rather than failing anywhere
      # a human would notice first. This parses every one of them.
      - name: Every mermaid diagram in tracked markdown parses
        run: npm run check:mermaid

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # One eslint run over every workspace plus tools/, from the single flat
    # config at the repo root (eslint.config.js). It is type-aware — the rules
    # that matter here are the no-unsafe-* family, which need real types to say
    # anything — so it is closer in cost to a typecheck than to a formatter, and
    # it gets its own job rather than a step on `test` so "the types are wrong"
    # and "a rule was broken" arrive as two separate answers.
    #
    # Needs the submodule: apps/web/src/live-office imports vendor/pixel-agents'
    # own sources, so the project service cannot resolve types without it.
    # Needs layout-core's dist for the same reason `typecheck` does — the root
    # `prelint` script builds it.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # Typecheck + fast tests across every workspace (layout-core, api,
    # renderer). layout-core's suite runs against the real pinned submodule
    # rather than a fixture: the point of the package is that it agrees with
    # the upstream we ship. Nothing here needs a real Postgres or a browser —
    # api's tests use a fake pool, renderer's slow browser suite is the
    # separate "renderer" job below.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The detail page's live office is a second Vite entry which compiles
      # selected modules and decoded sprites from the pinned submodule. Unit
      # tests cannot prove that multi-page production bundle still assembles.
      - name: Build the web SPA
        run: npm run build --workspace @pixel-index/web

      # The avatar package is private for now but kept ready to publish
      # (packages/pixatar/PUBLISHING.md): this is the tarball `npm publish`
      # would ship, so a packaging slip shows on the PR rather than on the day
      # someone publishes it.
      - name: The avatar package packs cleanly
        run: npm pack --dry-run --workspace @pixel-index/pixatar

  api-e2e:
    name: API end-to-end (real Postgres + renderer + API)
    runs-on: ubuntu-latest
    # Everything in `test` above runs against a fake pool / PGlite / a
    # stubbed renderer — fast, but it never proves the actual Docker images
    # boot, migrate, and talk to each other. This does: builds the real
    # services/api and services/renderer images, brings up a real Postgres
    # alongside them, and drives the whole owner+admin flow over real
    # HTTP. See services/api/e2e/.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      # typecheck:e2e/test:e2e are called workspace-scoped, which skips the
      # root's pretypecheck/pretest hooks (npm only fires "pre*" lifecycle
      # scripts for the root-level script of the same name) — build
      # layout-core explicitly instead of relying on that.
      - name: Build layout-core
        run: npm run build:core

      - name: Typecheck the e2e script itself
        run: npm run typecheck:e2e --workspace @pixel-index/api

      - name: Run the e2e suite
        run: npm run test:e2e --workspace @pixel-index/api

  web-docker-build:
    name: Web Docker image builds
    runs-on: ubuntu-latest
    # `test` above already proves `npm run build --workspace @pixel-index/web`
    # assembles — it does NOT prove `apps/web/Dockerfile`'s own COPY list
    # actually supplies everything that build needs, since the Dockerfile
    # builds inside a clean container with its own explicit, hand-picked file
    # list (self-hosting only, #17 — the official index deploys via GitHub
    # Pages instead, see pages.yml). That gap is exactly how a missing `COPY
    # vendor/pixel-agents/package.json` line (needed by `assertUpstream()`,
    # `packages/layout-core/src/upstream.ts`, once `liveOfficeAssets.ts`
    # started calling `furnitureCategories()`) shipped broken and was only
    # caught by hand later: `api-e2e` below builds the real `services/api`
    # and `services/renderer` images every run, but nothing built this one.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the web Docker image
        run: docker build -f apps/web/Dockerfile --build-arg VITE_API_BASE_URL=https://api.example.com -t pixel-index-web .

      # The image's nginx.conf decides which paths are app routes and which are
      # build files, and the two share /assets/: a direct load (a reload, a
      # shared link) of an app route under it once 404'd while in-app
      # navigation worked. Load each kind for real.
      - name: The web image serves app routes, build files and misses correctly
        run: |
          docker run -d --name web -p 8080:80 pixel-index-web
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          expect() { # path, status, header pattern
            out=$(curl -s -o /dev/null -D - "http://localhost:8080$1")
            echo "$out" | head -1 | grep -q " $2" || { echo "$1: expected $2, got: $(echo "$out" | head -1)"; exit 1; }
            [ -z "$3" ] || echo "$out" | grep -qi "$3" || { echo "$1: missing header $3"; exit 1; }
            echo "ok $1 -> $2"
          }
          for route in /layouts/ /assets /assets/ /assets/submit /assets/design /assets/CHAR_0 /soundtracks; do
            expect "$route" 200 'content-type: text/html'
          done
          asset=$(docker exec web sh -c 'ls /usr/share/nginx/html/assets/*.js | head -1' | sed 's|/usr/share/nginx/html||')
          expect "$asset" 200 'cache-control: public, max-age=31536000, immutable'
          expect /assets/no-such-file.js 404

  renderer:
    name: Renderer integration tests
    runs-on: ubuntu-latest
    # The only job that installs a real browser. It proves both browser-backed
    # render paths: renderer determinism/concurrency/timeouts/cache/HTTP against
    # actual PNGs, and the web detail page's separate live iframe. The former
    # used to assert byte-parity against v1's static build script too; that was
    # removed in #18 along with the script.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      - name: Install upstream webview dependencies
        run: npm ci
        working-directory: vendor/pixel-agents

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # test:integration is workspace-scoped, which skips the root's
      # pretest hook — build layout-core explicitly (its dist is imported
      # directly by the test, not just by the renderer's own src).
      - name: Build layout-core
        run: npm run build:core

      - name: Renderer integration tests
        run: npm run test:integration --workspace @pixel-index/renderer

      # This builds the Pages-subpath production SPA, serves a mock API backed
      # by the pinned upstream default layout, then drives the live iframe in
      # this job's real Chromium. It guards the browser integration that a
      # renderer screenshot alone cannot: decoded asset sidecars, OfficeCanvas,
      # ToolOverlay CSS, postMessage, controls and persisted fallback mode.
      # The web build imports the avatar package's dist, and test:e2e is
      # workspace-scoped, so the root's pre* hooks never build it.
      - name: Build the avatar package
        run: npm run build:pixatar

      - name: Live layout preview end-to-end
        run: npm run test:e2e --workspace @pixel-index/web

      - name: Upload live-preview failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-preview-failure
          path: apps/web/test-results/
          if-no-files-found: ignore

  pixatar-python:
    name: Python avatar client against the real CLI
    runs-on: ubuntu-latest
    # How a Python project uses the avatar package: packages/pixatar/python is
    # a dependency-free client that runs the package's `pixatar` command in a
    # Node process (`pixatar serve`). Installed here the way a project would
    # install them — the client with pip, the CLI from the npm tarball onto the
    # PATH, which is where the client looks when nothing names the command —
    # and checked against the JavaScript package's pinned codes and PNG hashes.
    strategy:
      matrix:
        # The oldest Python the client supports, and the newest.
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install index tooling
        run: npm ci

      # Installed from the tarball rather than run from the checkout, so a
      # packaging slip (a file missing from `files`, a broken bin) fails here.
      - name: Install the pixatar command from the npm tarball onto the PATH
        run: |
          npm pack --workspace @pixel-index/pixatar --pack-destination "$RUNNER_TEMP"
          npm install --global "$RUNNER_TEMP"/pixel-index-pixatar-*.tgz
          command -v pixatar
          pixatar --version

      - name: Install the Python client
        run: pip install './packages/pixatar/python[test]'

      - name: Python client tests, with the command found on the PATH
        working-directory: packages/pixatar/python
        run: pytest
