name: Deploy gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

# The SPA is built from scratch on every push to main — there is no
# previous-build cache to go stale, and the point of #12 is exactly that
# this workflow no longer needs a real browser (Playwright/Chromium) at all:
# it now builds apps/web, not the old Playwright-rendered static gallery.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The detail page's live office compiles the pinned Pixel Agents
          # renderer and sprite assets into the otherwise-static SPA.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install index tooling
        run: npm ci

      # apps/web/build/liveOfficeAssets.ts imports @pixel-index/layout-core
      # (furnitureCategories()) — has to be built first, since `import`
      # resolves package.json's "main" (dist/index.js), not source.
      - name: Build layout-core
        run: npm run build:core

      - name: Build the SPA
        working-directory: apps/web
        env:
          # A GitHub Pages PROJECT site is served from /<repo-name>/, which
          # has to be baked into every asset path at build time — see
          # vite.config.ts. The repo name is the right default and survives a
          # rename on its own. Set the repository variable PAGES_BASE_PATH to
          # `/` only if Pages serves this site from the ROOT — note a custom
          # domain on the USER site keeps the /<repo>/ subpath, so it is the
          # subpath, not the domain, that decides (see docs/deployment.md).
          VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          # No default is safe to bake into a production build (unlike the
          # localhost default client.ts falls back to for local dev) — set
          # this in the repo's Settings > Secrets and variables > Actions >
          # Variables once the API has a real production URL. It has to be a
          # REPOSITORY-level variable, not an Environment one: this job
          # declares no `environment:`, so environment-scoped vars are not in
          # scope here (docs/deployment.md explains why the build job stays
          # environment-free). Unset, the
          # deployed site's API calls degrade to a clear "unreachable"
          # message rather than a blank page (see #12's acceptance criteria)
          # instead of silently trying someone's localhost.
          VITE_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
